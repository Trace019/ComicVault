    <section class="account-wrapper">
        <div class="profile-content">

                    <button class="logout-button" id="logoutBtn" type="button"></button>
                </div>

                <div class="profile-breakdown"></div>

                <div class="profile-details">

                    <p class="profile-email">
                        <span class="dataType">Email</span> 
                        <span id="emailDisplay">test10101010@gmail.com</span>
                    </p>

                    <p class="profile-phone">
                        <span class="dataType">Phone</span>
                        <span id="phoneDisplay">+00000000000</span>
                    </p>
                    
                    <p class="profile-address">
                        <span class="dataType">Address</span>
                        <span id="addressDisplay">12a test address, city country</span>
                    </p>

                    <p class="profile-pass">
                        <span class="dataType">Password</span>
                        <span id="passwordDisplay">Null</span>
                    </p>

                    <p class="profile-creation-date">
                        <span class="dataType">Creation Date</span>
                        <span id="creationDisplay">1/1/2000</span>
                    </p>
                </div>
            </div>
    </section>
