<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://kit.fontawesome.com/489c5b8ea3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="homepage.css">
    <script src="homepage.js" defer></script>
    <script src="product.js" defer></script>
    <script src="theme.js" defer></script>
</head>
<body>
    <nav class="navbar">

        <div class="logo">
            Comic Vault
        </div>
        <ul class="nav-list">
            <li>
                <a href="homepage.html" class="navbar-link">
                    <span class="link-text">Home</span>
                </a>
            </li>
            <li>
                <a href="vault.html" class="navbar-link">
                    <span class="link-text">Wishlist</span>
                </a>
            </li>
            <li>
                <a href="browse.html" class="navbar-link">
                    <span class="link-text">Browse</span>
                </a>
            </li>
        </ul>
        <div class="icons">
            <a href="settings.html" id="active-icon"  class="navbar-link">
                    <i class="fa-solid fa-gear"></i>
            </a>
            <a href="cart.html" class="navbar-link">
                    <i class="fa-solid fa-cart-shopping"></i>
            </a>
            <a href="account.html" class="navbar-link">
                    <i class="fa-solid fa-circle-user"></i>
            </a>
        </div>

    </nav>
    <section class="setting-wrapper">
        <article class="setting-option">
            <div class="theme-selector">
                <h2 class="setting-title">Settings</h2>
                <h2 for="themeSelect" class="setting-tab">Theme: </h2>
                <select id="themeSelect">
                    <option value="">Crimson Forest</option>
                    <option value="ender">Ender Zero</option>
                    <option value="bio">BioForest</option>
                    <option value="pastel">Pastel Crystal</option>
                </select>
            </div>
            <div class="autofill-wrapper">
                <h2 class="setting-tab">Personal  Info</h2>
                <div class="autofill-inputs">
                    <label for="phone">Contact Info: </label>
                    <input type="text" id="phone-autoA" name="phone" placeholder="Contact Info" min="1" maxlength="12">

                    <label for="address">Address: </label>
                    <input type="text" id="address-autoA" name="address" placeholder="Address">
                </div>
            </div>
        </article>
        
    </section>
    </body>
</html>
