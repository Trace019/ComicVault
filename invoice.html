<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://kit.fontawesome.com/489c5b8ea3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="invoice.css">
    
    <script src="homepage.js" defer></script>
    <script src="product.js" defer></script>
    <script src="theme.js" defer></script>
</head>
<body>
    <nav class="navbar">

        <div class="logo">
            Comic Vault
        </div>
        <ul class="nav-list">
            <li>
                <a href="homepage.html" class="navbar-link">
                    <span class="link-text">Home</span>
                </a>
            </li>
            <li>
                <a href="vault.html" class="navbar-link">
                    <span class="link-text">Wishlist</span>
                </a>
            </li>
            <li>
                <a href="browse.html" class="navbar-link">
                    <span class="link-text">Browse</span>
                </a>
            </li>
            <li>
                <a href="orders.html" class="navbar-link" id="active">
                    <span class="link-text">Orders</span>
                </a>
            </li>
        </ul>
        <div class="icons">
            <a href="settings.html" class="navbar-link">
                    <i class="fa-solid fa-gear"></i>
            </a>
            <a href="cart.html" class="navbar-link">
                    <i class="fa-solid fa-cart-shopping"></i>
            </a>
            <a href="account.html" class="navbar-link">
                    <i class="fa-solid fa-circle-user"></i>
            </a>
        </div>
    </nav>
    <section class="printed-receipt">
        <article class="invoice-content">
            <div class="header">
                <div class="header-left">
                    <span class="invoice">Invoice</span><br>
                    <span class="company-name">ComicVault Inc.</span>
                </div>
                <div class="header-right">
                    <i class="fa-solid fa-file-contract"></i>
                </div>
            </div>

            <div class="bill-info">
                <div class="billed-to">
                    <h3>Billed To:</h3>
                    <p id="invoice-name">Name:</p> 
                    <p id="invoice-email">Email:</p>
                    <p id="invoice-contact">Contact Info:</p>
                    <p id="invoice-address">Address:</p>
                </div>
                <div class="issued-on">
                    <h3>Issued On:</h3>
                    <p id="invoice-id">Invoice ID</p> 
                    <p id="invoice-date">Date</p> 
                </div>
            </div>
            <div class="receipt-table">
                <div class="invoice-topbar">
                    <span>Name</span>
                    <span>Volume</span>
                    <span>Language</span>
                    <span>Price</span>
                    <span>Quantity</span>
                    <span>Amount</span>
                </div>

                <div class="invoice-items" id="invoice-items-container">
                    <!-- <div class="invoice-content">
                        <span>There Was a Cute Girl in the Hero's Party, so I Tried Confessing to Her</span>
                        <span>2</span>
                        <span>English</span>
                        <span>599</span>
                        <span>1</span>
                        <span>1</span>
                    </div> -->
                </div>

                <div class="invoice-total">
                    <div class="invoice-subtotal">
                        <p>Subtotal:</p>
                        <p>₱0</p>
                    </div>
                    <div class="invoice invoice-deliveryFee">
                        <p>Delivery Fee:</p>
                        <p>₱50</p>
                    </div>
                    <div class="invoice invoice-grandtotal">
                        <p>Grand Total:</p>
                        <p>₱50</p>
                    </div>
                </div>
            </div>

            <div class="invoice-actions">
                <button onclick="downloadPDF()" class="download-btn">
                    <i class="fa-solid fa-download"></i>
                </button>
                <button onclick="backToHome()" class="home-btn">
                    <i class="fa-solid fa-home"></i>
                </button>
                <button onclick="viewAllOrders()" class="orders-btn">
                    <i class="fa-solid fa-list"></i>
                </button>
                <!-- <button onclick="deleteInvoice('${order.orderID}')" class="delete-invoice-btn">
                    <i class="fa-solid fa-delete-left"></i>
                </button> -->
            </div>
        </article>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            generateInvoice();
        });

        function backToHome() {
            window.location.href = "homepage.html";
        }

        function viewAllOrders() {
            window.location.href = "orders.html";
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    </body>
</html>
