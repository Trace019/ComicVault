<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://kit.fontawesome.com/489c5b8ea3.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="homepage.css">
    <link rel="stylesheet" href="product.css">
    <link rel="stylesheet" href="logsign.css">
    <script src="homepage.js" defer></script>
    <script src="product.js" defer></script>
    <script src="theme.js" defer></script>
</head>
<body>
    <nav class="navbar">

        <div class="logo">
            Comic Vault
        </div>
        <ul class="nav-list">
            <li>
                <a href="homepage.html" class="navbar-link">
                    <span class="link-text">Home</span>
                </a>
            </li>
            <li>
                <a href="vault.html" class="navbar-link">
                    <span class="link-text">Wishlist</span>
                </a>
            </li>
            <li>
                <a href="browse.html" class="navbar-link">
                    <span class="link-text">Browse</span>
                </a>
            </li>
            <li>
                <a href="orders.html" class="navbar-link">
                    <span class="link-text">Orders</span>
                </a>
            </li>
        </ul>
        <div class="icons">
            <a href="settings.html" class="navbar-link">
                    <i class="fa-solid fa-gear"></i>
            </a>
            <a href="cart.html" class="navbar-link">
                    <i class="fa-solid fa-cart-shopping"></i>
            </a>
            <a href="account.html" class="navbar-link">
                    <i class="fa-solid fa-circle-user"></i>
            </a>
        </div>
    </nav>
    <section class="logsign-wrapper">
        <article class="logsign-content">
            <form>
            <h1>Login</h1>
            <div class="input-box">
                <input type="email" name="email" placeholder="Email" id="email" required>
                <i class="fa-solid fa-envelope"></i>
            </div>

            <div class="input-box">
                <input type="password" name="password" placeholder="Password" id="password" required>
                <i class='fa-solid fa-lock' id="showhidePass"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox">Remember Me?</label>
                </label>
                <a href="#forgotpassword.html">Forgot Password?</a>
            </div>
            
            <button type="submit" class="logbtn" id="loginbtn">Login</button>

            <div class="reglink">
                <p>Don't have an account yet? <a href="signup.html">Sign Up.</a></p>
            </div>
        </form>
        </article>
        
    </section>
    </body>
</html>
